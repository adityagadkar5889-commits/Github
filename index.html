<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
    }

    .register-container {
      width: 400px;
      padding: 35px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .register-container h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #333;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 7px;
      color: #555;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .input-group input:focus {
      border-color: #667eea;
    }

    .terms {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 15px 0 20px;
      font-size: 13px;
      color: #555;
    }

    .terms input {
      width: 15px;
      height: 15px;
    }

    .terms a {
      color: #667eea;
      text-decoration: none;
    }

    .register-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .register-btn:hover {
      background: #5568d8;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }

    .login a {
      color: #667eea;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="register-container">

    <h2>Create Account</h2>

    <form>

      <div class="input-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Create a password"
          required
        >
      </div>

      <div class="input-group">
        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          placeholder="Confirm your password"
          required
        >
      </div>

      <div class="terms">
        <input type="checkbox" id="terms" required>
        <label for="terms">
          I agree to the <a href="#">Terms & Conditions</a>
        </label>
      </div>

      <button type="submit" class="register-btn">
        Register
      </button>

      <div class="login">
        Already have an account?
        <a href="login.html">Login</a>
      </div>

    </form>

  </div>

</body>
</html>
