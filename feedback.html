<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
    }

    .feedback-container {
      width: 450px;
      padding: 35px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .feedback-container h2 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
    }

    .feedback-container .description {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 7px;
      color: #555;
      font-size: 14px;
      font-weight: bold;
    }

    .input-group input,
    .input-group textarea,
    .input-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .input-group input:focus,
    .input-group textarea:focus,
    .input-group select:focus {
      border-color: #667eea;
    }

    .input-group textarea {
      height: 120px;
      resize: vertical;
    }

    .rating {
      display: flex;
      flex-direction: row-reverse;
      justify-content: flex-end;
      gap: 5px;
      margin-top: 5px;
    }

    .rating input {
      display: none;
    }

    .rating label {
      font-size: 30px;
      color: #ccc;
      cursor: pointer;
      transition: 0.2s;
    }

    .rating label:hover,
    .rating label:hover ~ label,
    .rating input:checked ~ label {
      color: #ffc107;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .submit-btn:hover {
      background: #5568d8;
    }

    .back-home {
      text-align: center;
      margin-top: 20px;
    }

    .back-home a {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .feedback-container {
        width: 100%;
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="feedback-container">

    <h2>Give Us Your Feedback</h2>

    <p class="description">
      Your feedback helps us improve our website.
    </p>

    <form>

      <!-- Name -->
      <div class="input-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your name"
          required
        >
      </div>

      <!-- Email -->
      <div class="input-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <!-- Rating -->
      <div class="input-group">
        <label>Rate Your Experience</label>

        <div class="rating">

          <input type="radio" id="star5" name="rating" value="5" required>
          <label for="star5">★</label>

          <input type="radio" id="star4" name="rating" value="4">
          <label for="star4">★</label>

          <input type="radio" id="star3" name="rating" value="3">
          <label for="star3">★</label>

          <input type="radio" id="star2" name="rating" value="2">
          <label for="star2">★</label>

          <input type="radio" id="star1" name="rating" value="1">
          <label for="star1">★</label>

        </div>
      </div>

      <!-- Feedback -->
      <div class="input-group">
        <label for="feedback">Your Feedback</label>

        <textarea
          id="feedback"
          placeholder="Write your feedback here..."
          required
        ></textarea>
      </div>

      <!-- Submit -->
      <button type="submit" class="submit-btn">
        Submit Feedback
      </button>

    </form>

    <div class="back-home">
      <a href="index.html">← Back to Home</a>
    </div>

  </div>

</body>
</html>
