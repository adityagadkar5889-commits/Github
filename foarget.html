<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 20px;
    }

    .forgot-container {
      width: 380px;
      padding: 40px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .forgot-container h2 {
      color: #333;
      margin-bottom: 15px;
    }

    .forgot-container p {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
    }

    .input-group input:focus {
      border-color: #667eea;
    }

    .reset-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #667eea;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .reset-btn:hover {
      background: #5568d8;
    }

    .back-login {
      margin-top: 20px;
      font-size: 14px;
    }

    .back-login a {
      color: #667eea;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="forgot-container">

    <h2>Forgot Password?</h2>

    <p>
      Enter your registered email address and we'll send you
      a link to reset your password.
    </p>

    <form>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>

      <button type="submit" class="reset-btn">
        Send Reset Link
      </button>

    </form>

    <div class="back-login">
      <a href="login.html">← Back to Login</a>

    <div></div>

 <a href="feedback.html">← Go to Feedback</a>
  </div>

</body>
</html>
